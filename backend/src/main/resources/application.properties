spring.application.name=backend

# =====================================================================
# THƯ MỤC TẠM (TMP) — QUAN TRỌNG
# ---------------------------------------------------------------------
# Spring Boot 4.1 (hardening mới) kiểm tra quyền sở hữu của thư mục
# temp mà Tomcat dùng để lưu session. Nếu thư mục đó đã tồn tại từ
# lần chạy trước (do user khác tạo, ví dụ lúc chạy với quyền Admin)
# → lỗi:
#   "Existing directory 'C:\...\Temp\FE68...' is not owned by <user>"
#
# Cách tránh: trỏ java.io.tmpdir về thư mục riêng trong project, nơi
# chắc chắn chúng ta là owner.
#
# Lưu ý: giá trị này chỉ có tác dụng khi chạy qua Maven
# (đã cấu hình trong .mvn/jvm.config). Nếu chạy `java -jar` trực tiếp
# thì thêm:  java -Djava.io.tmpdir=target/tmp -jar backend.jar
# =====================================================================

# =====================================================================
# LƯU Ý: file .properties KHÔNG hỗ trợ comment ở CUỐI DÒNG.
# "#" chỉ được dùng khi nằm ở ĐẦU DÒNG, nếu không toàn bộ phần
# sau sẽ bị đọc thành giá trị (vd: "300#5 phút" -> lỗi convert sang int).
# =====================================================================

# ----- Database Configuration - PostgreSQL -----
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=332003
spring.datasource.driver-class-name=org.postgresql.Driver

# ----- JPA/Hibernate Configuration -----
# validate: Hibernate CHỈ kiểm tra schema khớp entity, KHÔNG tự ý sửa.
# Toàn bộ schema do Flyway quản lý qua file db/migration/V*.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ----- Flyway -----
# enabled: bật migration khi app start
# baseline-on-migrate: nếu DB có schema sẵn (không do Flyway tạo), tự baseline ở V0
# rồi apply các migration từ V1 trở đi
# baseline-version: version bắt đầu baseline
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ----- JWT -----
app.jwt.secret=${JWT_SECRET:dev-secret-please-change-this-in-production-it-must-be-at-least-256-bits-long}
# 15 phút (ms)
app.jwt.access-token-expiration=900000
# 7 ngày (ms)
app.jwt.refresh-token-expiration=604800000
app.jwt.issuer=CauLongDee

# ----- OTP -----
app.otp.length=6
# 5 phút
app.otp.ttl-seconds=300
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60

# ----- SMS (SpeedSMS.vn) -----
app.sms.provider=speedsms
# Lấy access token tại https://speedsms.vn/my-account/api
# Đặt biến môi trường SPEEDSMS_ACCESS_TOKEN=xxxx hoặc sửa trực tiếp ở đây
app.sms.access-token=${SPEEDSMS_ACCESS_TOKEN:}
# Tên brand người gửi — phải được SpeedSMS duyệt trước
app.sms.sender=${SPEEDSMS_SENDER:CauLongDee}

# ⚠️ MOCK MODE
#   true  → mã OTP được trả về thẳng cho frontend (hiện trên màn hình).
#           Dùng để dev/test, KHÔNG tốn tiền SMS.
#   false → gọi API SpeedSMS thật, mã OTP gửi về điện thoại.
#           BẮT BUỘC set false khi lên production.
app.sms.mock=true

# ----- CORS -----
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ----- Tomcat Session Store -----
# Chỉ định thư mục lưu session riêng trong project.
# Nếu KHÔNG set, Spring Boot dùng %TEMP%\servlet-sessions và có thể
# gặp lỗi "not owned by <user>" (xem phần TMP ở đầu file).
server.servlet.session.store-dir=target/tomcat-sessions
# App dùng JWT stateless → không cần persist session qua lần restart
server.servlet.session.persistent=false